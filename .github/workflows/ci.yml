name: CI / Test Pipeline

env:
  TEST_RUNNER_IMAGE: ghcr.io/${{ github.repository }}/test-runner:${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "testing_*" ]
  pull_request:
    branches: [ "main", "master" ]

defaults:
  run:
    working-directory: src

jobs:
  # =========================================================================
  # 1. Сборка контейнера тестов
  # =========================================================================
  build-test-image:
    name: Build Test Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Cached Test Image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile.testing
          push: true
          tags: ${{ env.TEST_RUNNER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 2. Стадия 1/4: UNIT тесты
  # =========================================================================
  test-unit:
    name: 1. Unit Tests
    needs: build-test-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests in Docker
        run: |
          mkdir -p TestResults
          docker pull "$TEST_RUNNER_IMAGE"
          docker compose -f docker-compose.testing.yml run --rm test-runner unit

      - name: Upload Unit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: src/TestResults/
          if-no-files-found: ignore

  # =========================================================================
  # 3. Стадия 2/4: INTEGRATION тесты
  # =========================================================================
  test-integration:
    name: 2. Integration Tests
    needs: test-unit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Integration Tests in Docker
        run: |
          mkdir -p TestResults
          docker pull "$TEST_RUNNER_IMAGE"
          docker compose -f docker-compose.testing.yml run --rm test-runner integration

      - name: Upload Integration Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: src/TestResults/
          if-no-files-found: ignore

  # =========================================================================
  # 4. Стадия 3/4: E2E тесты
  # =========================================================================
  test-e2e:
    name: 3. E2E Tests
    needs: test-integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run E2E Tests in Docker
        run: |
          mkdir -p TestResults
          docker pull "$TEST_RUNNER_IMAGE"
          docker compose -f docker-compose.testing.yml run --rm test-runner e2e

      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: src/TestResults/
          if-no-files-found: ignore
      
  # =========================================================================
  # 5. Стадия 4/4: BDD-тесты аутентификации
  # =========================================================================
  test-bdd:
    name: 4. BDD Auth & 2FA Tests
    needs: test-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run BDD Tests in Docker
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BDD_TECH_PASSWORD: ${{ secrets.BDD_TECH_PASSWORD }}
          BDD_TECH_NEW_PASSWORD: ${{ secrets.BDD_TECH_NEW_PASSWORD }}
        run: |
          mkdir -p TestResults
          docker pull "$TEST_RUNNER_IMAGE"
          docker compose -f docker-compose.testing.yml run --rm test-runner bdd

      - name: Upload BDD Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-results
          path: src/TestResults/
          if-no-files-found: ignore

  # =========================================================================
  # 6. Генерация Allure-отчета с трендами и публикация
  # =========================================================================
  allure-report:
    name: Generate Allure Report & Trends
    needs: [test-unit, test-integration, test-e2e, test-bdd]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-results'
          path: ${{ github.workspace }}/combined-results

      - name: Get Allure History
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure Report with History
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          mkdir -p combined-results allure-results
          find combined-results -type f -name "*.trx" -exec cp -t allure-results -- {} +
          if [ -z "$(find allure-results -maxdepth 1 -type f -name '*.trx' -print -quit)" ]; then
            echo "::error::No TRX test results were downloaded for Allure"
            exit 1
          fi

          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
          elif [ -d gh-pages/last-history ]; then
            cp -r gh-pages/last-history allure-results/history
          fi

          cat <<EOF > allure-results/executor.json
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Run #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "Allure Report"
          }
          EOF

          curl -fsSL https://github.com/allure-framework/allure2/releases/download/2.32.2/allure-2.32.2.tgz | tar -xz -C /tmp
          /tmp/allure-2.32.2/bin/allure generate allure-results -o allure-report --clean
          test -s allure-report/index.html

      - name: Upload Allure HTML Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error

      - name: Deploy Allure to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ success() && github.event_name != 'pull_request' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
