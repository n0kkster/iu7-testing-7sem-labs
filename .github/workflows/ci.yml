name: CI / Test Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "testing_02" ]
  pull_request:
    branches: [ "main", "master" ]

defaults:
  run:
    working-directory: src

jobs:
  # =========================================================================
  # 1. Сборка контейнера тестов
  # =========================================================================
  build-test-image:
    name: Build Test Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Testing Docker Image
        run: |
          docker compose -f docker-compose.testing.yml build

  # =========================================================================
  # 2. Стадия 1/3: UNIT тесты
  # =========================================================================
  test-unit:
    name: 1. Unit Tests
    needs: build-test-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Unit Tests in Docker
        run: |
          mkdir -p TestResults/allure-results
          docker compose -f docker-compose.testing.yml run --rm test-runner unit

      - name: Upload Unit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: src/TestResults/
          if-no-files-found: ignore

  # =========================================================================
  # 3. Стадия 2/3: INTEGRATION тесты
  # =========================================================================
  test-integration:
    name: 2. Integration Tests
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Integration Tests in Docker
        run: |
          mkdir -p TestResults/allure-results
          docker compose -f docker-compose.testing.yml run --rm test-runner integration

      - name: Upload Integration Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: src/TestResults/
          if-no-files-found: ignore

  # =========================================================================
  # 4. Стадия 3/3: E2E тесты
  # =========================================================================
  test-e2e:
    name: 3. E2E Tests
    needs: test-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run E2E Tests in Docker
        run: |
          mkdir -p TestResults/allure-results
          docker compose -f docker-compose.testing.yml run --rm test-runner e2e

      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: src/TestResults/
          if-no-files-found: ignore

  # =========================================================================
  # 5. Генерация Allure-отчета с трендами и публикация
  # =========================================================================
  allure-report:
    name: Generate Allure Report & Trends
    needs: [test-unit, test-integration, test-e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Test Results
        uses: actions/download-artifact@v4
        with:
          path: combined-results

      - name: Flatten Test Results for Allure
        run: |
          mkdir -p allure-results
          find combined-results -type f -name "*.trx" -exec cp {} allure-results/ \;
          echo "=== Найдено отчетов для Allure: ==="
          ls -la allure-results/

      - name: Get Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results   # Передаем плоскую папку с файлами .trx
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy Allure to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Upload Allure HTML Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-history