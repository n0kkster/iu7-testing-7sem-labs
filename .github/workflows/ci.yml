name: CI / Test Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "testing_*" ]
  pull_request:
    branches: [ "main", "master" ]

defaults:
  run:
    working-directory: src

jobs:
  # =========================================================================
  # 1. Сборка контейнера тестов
  # =========================================================================
  build-test-image:
    name: Build Test Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Testing Docker Image
        run: |
          docker compose -f docker-compose.testing.yml build

  # =========================================================================
  # 2. Стадия 1/4: UNIT тесты
  # =========================================================================
  test-unit:
    name: 1. Unit Tests
    needs: build-test-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Unit Tests in Docker
        run: |
          mkdir -p TestResults/allure-results
          docker compose -f docker-compose.testing.yml run --rm test-runner unit

      - name: Upload Unit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: src/TestResults/
          if-no-files-found: ignore

  # =========================================================================
  # 3. Стадия 2/4: INTEGRATION тесты
  # =========================================================================
  test-integration:
    name: 2. Integration Tests
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Integration Tests in Docker
        run: |
          mkdir -p TestResults/allure-results
          docker compose -f docker-compose.testing.yml run --rm test-runner integration

      - name: Upload Integration Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: src/TestResults/
          if-no-files-found: ignore

  # =========================================================================
  # 4. Стадия 3/4: E2E тесты
  # =========================================================================
  test-e2e:
    name: 3. E2E Tests
    needs: test-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run E2E Tests in Docker
        run: |
          mkdir -p TestResults/allure-results
          docker compose -f docker-compose.testing.yml run --rm test-runner e2e

      - name: Upload E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: src/TestResults/
          if-no-files-found: ignore
      
  # =========================================================================
  # 5. Стадия 4/4: BDD-тесты аутентификации
  # =========================================================================
  test-bdd:
    name: 4. BDD Auth & 2FA Tests
    needs: test-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run BDD Tests in Docker
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BDD_TECH_PASSWORD: ${{ secrets.BDD_TECH_PASSWORD }}
          BDD_TECH_NEW_PASSWORD: ${{ secrets.BDD_TECH_NEW_PASSWORD }}
        run: |
          mkdir -p TestResults
          docker compose -f docker-compose.testing.yml run --rm test-runner bdd

      - name: Upload BDD Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-results
          path: src/TestResults/
          if-no-files-found: ignore

  # =========================================================================
  # 6. Генерация Allure-отчета с трендами и публикация
  # =========================================================================
  allure-report:
    name: Generate Allure Report & Trends
    needs: [test-unit, test-integration, test-e2e, test-bdd]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Test Results
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/combined-results

      - name: Flatten Test Results for Allure
        run: |
          mkdir -p "$GITHUB_WORKSPACE/allure-results"
          find "$GITHUB_WORKSPACE/combined-results" -type f -name "*.trx" -exec cp {} "$GITHUB_WORKSPACE/allure-results/" \;
          echo "=== Найдено отчетов: ==="
          ls -la "$GITHUB_WORKSPACE/allure-results"

      - name: Get Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure Report with History
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -d "$GITHUB_WORKSPACE/gh-pages/history" ]; then
            cp -r "$GITHUB_WORKSPACE/gh-pages/history" "$GITHUB_WORKSPACE/allure-results/history"
          elif [ -d "$GITHUB_WORKSPACE/gh-pages/last-history" ]; then
            cp -r "$GITHUB_WORKSPACE/gh-pages/last-history" "$GITHUB_WORKSPACE/allure-results/history"
          fi

          cat <<EOF > "$GITHUB_WORKSPACE/allure-results/executor.json"
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Run #${{ github.run_number }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "Allure Report"
          }
          EOF

          curl -fsSL https://github.com/allure-framework/allure2/releases/download/2.32.2/allure-2.32.2.tgz | tar -xz -C /tmp
          /tmp/allure-2.32.2/bin/allure generate "$GITHUB_WORKSPACE/allure-results" -o "$GITHUB_WORKSPACE/allure-report" --clean

      - name: Deploy Allure to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload Allure HTML Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report