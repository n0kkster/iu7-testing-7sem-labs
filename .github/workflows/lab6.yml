name: Lab 6 / Observability

on:
  workflow_dispatch:
  push:
    branches: [testing_06]
  pull_request:
    branches: [main, master]
    paths:
      - 'src/Analyzer.Api/**'
      - 'src/Analyzer.Application/**'
      - 'src/Analyzer.Infrastructure/**'
      - 'src/docker-compose.lab6.yml'
      - 'src/monitoring/**'
      - 'src/scenarios/**'
      - 'src/scripts/*lab6*'
      - '.github/workflows/lab6.yml'

permissions:
  contents: read

jobs:
  observability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - name: Prepare output directory
        run: |
          lab6_output=$(mktemp -d "$RUNNER_TEMP/lab6.XXXXXX")
          printf 'LAB6_OUTPUT=%s\n' "$lab6_output" >> "$GITHUB_ENV"

      - name: Set up k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '1.4.2'

      - name: Run the four soak0 modes
        run: python3 scripts/run-lab6.py --output "$LAB6_OUTPUT"

      - name: Collect Compose diagnostics
        if: ${{ failure() && env.LAB6_OUTPUT != '' }}
        run: |
          docker compose -f docker-compose.lab6.yml ps -a 2>&1 | tee "$LAB6_OUTPUT/compose-status.log"
          docker compose -f docker-compose.lab6.yml logs --no-color --tail=150 2>&1 | tee "$LAB6_OUTPUT/compose.log"

      - name: Show resource comparison
        if: ${{ always() && env.LAB6_OUTPUT != '' }}
        run: |
          if test -f "$LAB6_OUTPUT/report.md"; then
            cat "$LAB6_OUTPUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report, samples and Tempo traces
        if: ${{ always() && env.LAB6_OUTPUT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lab6-soak0
          path: ${{ env.LAB6_OUTPUT }}
          if-no-files-found: ignore
