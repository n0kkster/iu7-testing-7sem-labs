services:
  neo4j-ppo:
    image: neo4j:latest
    container_name: neo4j-ppo
    ports:
      - "${PORT_NEO4J_HTTP}:7474"
      - "${PORT_NEO4J_BOLT}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_LOGIN}/${NEO4J_PASSWORD}"

      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: true
      NEO4J_apoc_import_file_enabled: true
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - ./.neo4j/data:/data
      - ./.neo4j/logs:/logs
    restart: on-failure

  postgres-ppo:
    image: bitnami/postgresql:latest
    container_name: postgres-ppo
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRESQL_USERNAME: "${POSTGRES_LOGIN}"
      POSTGRESQL_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRESQL_DATABASE: "${POSTGRES_DB_NAME}"
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
    ports:
      - "${PORT_POSTGRES}:5432"
    volumes:
      - postgres-ppo-data:/bitnami/postgresql
    restart: on-failure
    profiles: ["postgres", "migration"]

  postgres-replica:
    image: bitnami/postgresql:latest
    container_name: postgres-replica
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRESQL_USERNAME: "${POSTGRES_LOGIN}"
      POSTGRESQL_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRESQL_DATABASE: "${POSTGRES_DB_NAME}"
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_MASTER_HOST: postgres-ppo
    volumes:
      - postgres-replica-data:/bitnami/postgresql
    depends_on:
      - postgres-ppo
    restart: on-failure
    profiles: ["postgres", "migration"]

  mongo-ppo:
    image: mongo:latest
    container_name: mongo-ppo
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_LOGIN}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
    ports:
      - "${PORT_MONGO}:27017"
    volumes:
      - mongo-ppo-data:/data/db
    restart: on-failure
    profiles: ["mongo", "migration"]

  seq-ppo:
    image: datalust/seq:latest
    container_name: seq-ppo
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: true
    ports:
      - "${PORT_SEQ}:80"
    volumes:
      - seq-ppo-data:/data
    restart: on-failure

  api-ppo:
    build:
      context: .
      dockerfile: Analyzer.Api/Dockerfile
    container_name: analyzer-api-ppo
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      DatabaseProvider: "${DATABASE_PROVIDER}"
    ports:
      - "${PORT_API}:8080"
    depends_on:
      - neo4j-ppo
      - seq-ppo
    restart: on-failure
    profiles: ["production"]

  api-ppo-read1:
    build:
      context: .
      dockerfile: Analyzer.Api/Dockerfile
    container_name: analyzer-api-read1
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      DatabaseProvider: "${DATABASE_PROVIDER}"
      RUN_MIGRATIONS: "false" 
      ConnectionStrings__PGConnection: "Host=postgres-replica;Port=5432;Database=${POSTGRES_DB_NAME};Username=${POSTGRES_LOGIN};Password=${POSTGRES_PASSWORD}"
    depends_on:
      - postgres-replica
      - neo4j-ppo
    restart: on-failure

  api-ppo-read2:
    build:
      context: .
      dockerfile: Analyzer.Api/Dockerfile
    container_name: analyzer-api-read2
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      DatabaseProvider: "${DATABASE_PROVIDER}"
      RUN_MIGRATIONS: "false" 
      ConnectionStrings__PGConnection: "Host=postgres-replica;Port=5432;Database=${POSTGRES_DB_NAME};Username=${POSTGRES_LOGIN};Password=${POSTGRES_PASSWORD}"
    depends_on:
      - postgres-replica
      - neo4j-ppo
    restart: on-failure

  api-ppo-mirror:
    build:
      context: .
      dockerfile: Analyzer.Api/Dockerfile
    container_name: analyzer-api-mirror
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      DatabaseProvider: "${DATABASE_PROVIDER}"
      RUN_MIGRATIONS: "false" 
      ConnectionStrings__PGConnection: "Host=postgres-ppo;Port=5432;Database=${POSTGRES_DB_NAME};Username=${POSTGRES_LOGIN};Password=${POSTGRES_PASSWORD}"
    depends_on:
      - postgres-ppo
      - neo4j-ppo
    restart: on-failure

  frontend-ppo:
    build:
      context: .
      dockerfile: Analyzer.Client/Dockerfile
    container_name: analyzer-web-ppo
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
    ports:
      - "${PORT_FRONT}:8080"
    depends_on:
      - api-ppo
    volumes:
      - ./.frontend/keys:/app/keys
    restart: on-failure
    profiles: ["production"]

  frontend-ppo-mirror:
    build:
      context: .
      dockerfile: Analyzer.Client/Dockerfile
    container_name: analyzer-web-mirror
    environment:
      ASPNETCORE_ENVIRONMENT: "Docker"
      PathBase: "/mirror"
      ApiBaseUrl: "http://api-ppo-mirror:8080"
    depends_on:
      - api-ppo-mirror
    volumes:
      - ./.frontend/mirror/keys:/app/keys
    restart: on-failure

  prism-mock:
    image: stoplight/prism:5
    container_name: prism-mock-ppo
    ports:
      - "${PORT_MOCK:-4010}:4010"
    volumes:
      - ./openapi.yaml:/openapi.yaml:ro
    command: ["mock", "-h", "0.0.0.0", "-m", "false", "/openapi.yaml"]
    restart: on-failure
    profiles: ["mock", "tools"]

  pgadmin-ppo:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-ppo
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@analyzer.ru"
      PGADMIN_DEFAULT_PASSWORD: "admin123"
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-ppo-data:/var/lib/pgadmin
    depends_on:
      - postgres-ppo
    restart: on-failure
    profiles: ["postgres", "production"]

  nginx-ppo:
    image: nginx:alpine
    container_name: nginx-ppo
    ports:
      - "${PORT_HTTP:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ../README.md:/usr/share/nginx/docs/README.md:ro
      - ../docs:/usr/share/nginx/docs_dir:ro
    depends_on:
      - api-ppo
      - pgadmin-ppo
      - frontend-ppo
    restart: on-failure
    profiles: ["production"]

  prometheus-ppo:
    image: prom/prometheus:latest
    container_name: prometheus-ppo
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: on-failure

  loki-ppo:
    image: grafana/loki:latest
    container_name: loki-ppo
    command: -config.file=/etc/loki/local-config.yaml
    restart: on-failure

  promtail-ppo:
    image: grafana/promtail:latest
    container_name: promtail-ppo
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: on-failure

  grafana-ppo:
    image: grafana/grafana:latest
    container_name: grafana-ppo
    environment:
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/monitoring/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus-ppo
      - loki-ppo
    restart: on-failure

volumes:
  postgres-ppo-data:
    name: postgres-ppo-data
  postgres-replica-data:
    name: postgres-replica-data
  mongo-ppo-data:
    name: mongo-ppo-data
  seq-ppo-data:
  pgadmin-ppo-data:
    name: pgadmin-ppo-data
  grafana-data: