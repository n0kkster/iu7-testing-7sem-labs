worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =========================================================
    # 1. ПУЛЫ СЕРВЕРОВ (UPSTREAMS)
    # =========================================================
    
    # Пул для чтения (соотношение 2:1:1)
    upstream backend_read {
        server api-ppo:8080 weight=2;
        server api-ppo-read1:8080 weight=1;
        server api-ppo-read2:8080 weight=1;
    }

    # Пул для записи (только главный инстанс)
    upstream backend_write {
        server api-ppo:8080;
    }

    # Пул для изолированного зеркала
    upstream backend_mirror {
        server api-ppo-mirror:8080;
    }

    upstream frontend_mirror {
        server frontend-ppo-mirror:8080;
    }

    # =========================================================
    # 2. ПРАВИЛА МАРШРУТИЗАЦИИ ПО HTTP-МЕТОДАМ
    # =========================================================
    
    map $request_method $api_upstream {
        default backend_write;
        GET     backend_read;
        HEAD    backend_read;
        OPTIONS backend_read;
    }

    map $request_method $mirror_api_upstream {
        default backend_write;
        GET     backend_mirror;
        HEAD    backend_mirror;
        OPTIONS backend_mirror;
    }

    # =========================================================
    # НАСТРОЙКИ СЖАТИЯ
    # =========================================================
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # =========================================================
    # НАСТРОЙКИ КЭШИРОВАНИЯ
    # =========================================================
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC_CACHE:10m inactive=24h max_size=1g;
    
    # Отключаем вывод версии NGINX в дефолтных страницах ошибок
    server_tokens off;

    server {
        listen 80;
        server_name localhost;

        proxy_hide_header Server;
        add_header Server "Analyzer-Super-Server" always;

        # Статика
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /reserved/ {
            alias /usr/share/nginx/html/;
            index index.html;
        }

        # Бонусы (документация и статус)
        location = /documentation {
            alias /usr/share/nginx/html/docs.html;
            default_type text/html;
            charset utf-8;
        }
        
        location = /raw-docs {
            alias /usr/share/nginx/docs/README.md;
            default_type text/plain;
            charset utf-8;
        }
        
        location /docs/ {
            alias /usr/share/nginx/docs_dir/;
        }

        location = /status {
            alias /usr/share/nginx/html/status.html;
            default_type text/html;
            charset utf-8;
        }

        location = /nginx_status {
            stub_status;
        }

        location /management {
            alias /usr/share/nginx/html/management.html;
            default_type text/html;
            charset utf-8;
        }

        # pgAdmin
        location /admin/ {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://pgadmin-ppo:80/;
            proxy_set_header X-Script-Name /admin;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect off;
        }

        # Swagger
        location /api/v2/docs/ {
            proxy_pass http://api-ppo:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger/ {
            proxy_pass http://api-ppo:8080/swagger/;
            proxy_set_header Host $host;
        }

        location /monitoring/ {
            proxy_pass http://grafana-ppo:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health checks
        location /health {
            proxy_pass http://api-ppo:8080/api/health/live;
            proxy_set_header Host $host;
        }

        location /ready {
            proxy_pass http://api-ppo:8080/api/health/ready;
            proxy_set_header Host $host;
        }

        # =========================================================
        # 3. ОСНОВНЫЕ МАРШРУТЫ ПРИЛОЖЕНИЯ
        # =========================================================

        # Умная балансировка основного API
        location /api/ {
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Зеркало API
        location /mirror/api/ {
            rewrite ^/mirror/(.*)$ /$1 break;
            
            proxy_pass http://$mirror_api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/legacy/(_framework|_content|css|js|images)/ {
            proxy_pass http://frontend-ppo:8080;
            
            proxy_cache STATIC_CACHE;
            proxy_cache_valid 200 1d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            
            add_header X-Cache-Status $upstream_cache_status always;
            
            proxy_hide_header Server;
            add_header Server "Analyzer-Super-Server" always;
        }

        # Основной GUI
        location /legacy {
            proxy_pass http://frontend-ppo:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Зеркальный GUI
        location /mirror {
            proxy_pass http://frontend_mirror;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}