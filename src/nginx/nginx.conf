worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /reserved/ {
            alias /usr/share/nginx/html/;
            index index.html;
        }

        location /documentation {
            alias /usr/share/nginx/docs/README.md;
            default_type text/plain;
            charset utf-8; 
        }

        location /management {
            alias /usr/share/nginx/html/management.html;
            default_type text/html;
            charset utf-8;
        }

        location /admin/ {
            auth_basic "Restricted Access";
            auth_basic_user_file /etc/nginx/.htpasswd;

            proxy_pass http://pgadmin-ppo:80/;
            proxy_set_header X-Script-Name /admin;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect off;
        }

        location /api/v2/docs/ {
            proxy_pass http://api-ppo:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger/ {
            proxy_pass http://api-ppo:8080/swagger/;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://api-ppo:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /legacy {
            proxy_pass http://frontend-ppo:8080;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /status {
            stub_status;
        }

        location /health {
            default_type text/plain;
            return 200 "healthy\n";
        }

        location /ready {
            default_type text/plain;
            return 200 "ready\n";
        }
    }
}