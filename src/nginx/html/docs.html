<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Документация проекта</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
    <style>
        body { box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; background-color: #0d1117; }
        .markdown-body { background-color: #0d1117; color: #c9d1d9; }
    </style>
</head>
<body class="markdown-body">
    <div id="content">Загрузка документации...</div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        fetch('/raw-docs')
            .then(response => {
                if (!response.ok) throw new Error('Не удалось загрузить файл');
                return response.text();
            })
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `<h3 style="color:red">Ошибка: ${err.message}</h3>`;
            });
    </script>
</body>
</html>
