openapi: 3.1.0
info:
  title: FaultAnalyzer API
  description: REST API сервиса предиктивного анализа отказоустойчивости распределенных систем.
  version: 1.0.0
servers:
  - url: http://localhost:1555
    description: Локальный сервер разработки

paths:
  # ==========================================
  # СИСТЕМЫ
  # ==========================================
  /api/v1/systems:
    get:
      summary: Получить список систем команды
      operationId: getSystemsByTeam
      tags: [Systems]
      security:
        - BearerAuth: []
      parameters:
        - name: teamId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '200':
          description: Список систем успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ITSystemDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Создать новую систему
      operationId: createSystem
      tags: [Systems]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateITSystemDto'
      responses:
        '201':
          description: Система создана
          headers:
            Location:
              schema:
                type: string
              description: Ссылка на созданный ресурс
              example: /api/v1/systems/b5952d76-e179-4d6d-88b9-e137452d1134
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/systems/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: b5952d76-e179-4d6d-88b9-e137452d1134

    get:
      summary: Получить систему по ID
      operationId: getSystemById
      tags: [Systems]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Детальная информация о системе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ITSystemDto'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Полное обновление системы
      operationId: updateSystem
      tags: [Systems]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateITSystemDto'
      responses:
        '204':
          description: Система успешно обновлена
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Частичное обновление системы
      operationId: patchSystem
      tags: [Systems]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchITSystemDto'
      responses:
        '200':
          description: Обновленная система
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ITSystemDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Удалить систему
      operationId: deleteSystem
      tags: [Systems]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Система удалена
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/systems/{id}/export:
    get:
      summary: Экспорт топологии системы
      operationId: exportSystem
      tags: [Systems]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: JSON-файл топологии компонентов и связей
          content:
            application/json:
              schema:
                type: object
                properties:
                  components:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComponentDto'
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/LinkDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/systems/import:
    post:
      summary: Импорт топологии системы
      operationId: importSystem
      tags: [Systems]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, importData]
              properties:
                file:
                  type: string
                  format: binary
                importData:
                  type: string
                  description: JSON-сериализованный CreateITSystemDto
      responses:
        '201':
          description: Система успешно импортирована
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/systems/{systemId}/components:
    get:
      summary: Получить компоненты системы по системному роуту
      operationId: getComponentsBySystemId
      tags: [Components]
      security:
        - BearerAuth: []
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список компонентов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComponentDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/systems/{systemId}/links:
    get:
      summary: Получить связи системы по системному роуту
      operationId: getLinksBySystemId
      tags: [Links]
      security:
        - BearerAuth: []
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список связей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # КОМПОНЕНТЫ
  # ==========================================
  /api/v1/components:
    get:
      summary: Получить список компонентов системы
      operationId: getComponents
      tags: [Components]
      security:
        - BearerAuth: []
      parameters:
        - name: systemId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список компонентов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComponentDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Создать компонент
      operationId: createComponent
      tags: [Components]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComponentDto'
      responses:
        '201':
          description: Компонент создан
          headers:
            Location:
              schema:
                type: string
              example: /api/v1/components/9a37e1b5-310e-43f1-bfa6-a36c1e55ecbf
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/components/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      summary: Получить компонент по ID
      operationId: getComponentById
      tags: [Components]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Детальная информация о компоненте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentDto'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Полная замена компонента
      operationId: updateComponent
      tags: [Components]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateComponentDto'
      responses:
        '200':
          description: Компонент обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Частичное обновление компонента
      operationId: patchComponent
      tags: [Components]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchComponentDto'
      responses:
        '200':
          description: Успешное частичное обновление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Удалить компонент
      operationId: deleteComponent
      tags: [Components]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Компонент удален
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # СВЯЗИ
  # ==========================================
  /api/v1/links:
    get:
      summary: Получить связи системы
      operationId: getLinks
      tags: [Links]
      security:
        - BearerAuth: []
      parameters:
        - name: systemId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список связей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Создать зависимость между узлами
      operationId: createLink
      tags: [Links]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkDto'
      responses:
        '201':
          description: Связь создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/links/{id}:
    delete:
      summary: Удалить связь
      operationId: deleteLink
      tags: [Links]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Связь удалена
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # АНАЛИЗ ОТКАЗОУСТОЙЧИВОСТИ
  # ==========================================
  /api/v1/analysis/simulate/{failedComponentId}:
    get:
      summary: Симуляция каскадного сбоя
      operationId: simulateFailure
      tags: [Analysis]
      security:
        - BearerAuth: []
      parameters:
        - name: failedComponentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список ID пораженных компонентов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid
                example: ["9a37e1b5-310e-43f1-bfa6-a36c1e55ecbf", "d41d8cd9-8f00-4b20-4e98-00998ecf8427"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/analysis/cycles/{systemId}:
    get:
      summary: Поиск циклических зависимостей
      operationId: detectCycles
      tags: [Analysis]
      security:
        - BearerAuth: []
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Найденные циклы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleAnalysisResultDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    
  /api/v1/analysis/decommission/{targetComponentId}:
    get:
      summary: Анализ последствий вывода из эксплуатации
      operationId: planDecommissioning
      tags: [Analysis]
      security:
        - BearerAuth: []
      parameters:
        - name: targetComponentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Результат оценки вывода
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecommissioningResultDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/analysis/deployment-risk/{targetComponentId}:
    get:
      summary: Оценка риска развертывания
      operationId: assessDeploymentRisk
      tags: [Analysis]
      security:
        - BearerAuth: []
      parameters:
        - name: targetComponentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Оценка риска релиза
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentRiskResultDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/analysis/spof/{systemId}:
    get:
      summary: Поиск единых точек отказа (SPOF)
      operationId: detectSpof
      tags: [Analysis]
      security:
        - BearerAuth: []
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: threshold
          in: query
          required: false
          schema:
            type: integer
            default: 3
      responses:
        '200':
          description: Список критических узлов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpofAnalysisResultDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # ПОЛЬЗОВАТЕЛИ И АУТЕНТИФИКАЦИЯ
  # ==========================================
  /api/v1/users/register:
    post:
      summary: Регистрация по инвайт-коду
      operationId: registerUser
      tags: [Users]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '200':
          description: Успешная регистрация
          content:
            application/json:
              schema:
                type: string
                format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/users/login:
    post:
      summary: Аутентификация пользователя
      operationId: loginUser
      tags: [Users]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Токен доступа выдан
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                example:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==========================================
  # КОМАНДЫ
  # ==========================================
  /api/v1/teams:
    get:
      summary: Получить список всех команд
      operationId: getAllTeams
      tags: [Teams]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список команд
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступно только администратору
    post:
      summary: Создать новую команду
      operationId: createTeam
      tags: [Teams]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamDto'
      responses:
        '200':
          description: Команда создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступно только администратору

  /api/v1/teams/{id}:
    delete:
      summary: Удалить команду
      operationId: deleteTeam
      tags: [Teams]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Команда удалена
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступно только администратору
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # ИНВАЙТЫ
  # ==========================================
  /api/v1/invites:
    post:
      summary: Создать инвайт в команду
      operationId: generateInvite
      tags: [Invites]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateInviteDto'
      responses:
        '200':
          description: Инвайт сгенерирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступно только администратору

  /api/v1/invites/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Получить инвайты команды
      description: Параметр {id} здесь обозначает идентификатор команды (TeamId)
      operationId: getTeamInvites
      tags: [Invites]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список инвайтов команды
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InviteDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Отозвать инвайт
      description: Параметр {id} здесь обозначает идентификатор инвайта
      operationId: revokeInvite
      tags: [Invites]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Инвайт отозван
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================
  # ПРОФИЛЬ И ПОЛЬЗОВАТЕЛИ
  # ==========================================
  /api/v1/users:
    get:
      summary: Получить всех пользователей системы
      operationId: getAllUsers
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Доступно только администратору

  /api/v1/users/{id}:
    delete:
      summary: Удалить пользователя
      operationId: deleteUser
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Пользователь удален
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/me:
    get:
      summary: Получить профиль текущего пользователя
      operationId: getMyProfile
      tags: [Users]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me/profile:
    put:
      summary: Обновить данные своего профиля
      operationId: updateMyProfile
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileDto'
      responses:
        '200':
          description: Профиль обновлен
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me/password:
    put:
      summary: Сменить пароль
      operationId: changeMyPassword
      tags: [Users]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Пароль изменен
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # АВАТАРЫ
  # ==========================================
  /api/v1/avatars/upload:
    post:
      summary: Загрузить аватар
      operationId: uploadAvatar
      tags: [Avatar]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Аватар загружен
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/avatars/history:
    get:
      summary: Получить историю аватаров текущего пользователя
      operationId: getAvatarHistory
      tags: [Avatar]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: История аватаров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvatarDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/avatars/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Скачать файл аватара
      operationId: getAvatarById
      tags: [Avatar]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Бинарные данные картинки
          content:
            image/*:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Удалить аватар
      operationId: deleteAvatar
      tags: [Avatar]
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Аватар удален
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Некорректные параметры запроса (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Отсутствует или невалиден токен аутентификации
    NotFound:
      description: Запрашиваемый ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    # --- Component ---
    ComponentType:
      type: string
      enum: [Microservice, Database, MessageBroker, ExternalAPI, Unknown]
      example: Microservice

    CreateComponentDto:
      type: object
      required: [systemId, type, name, description]
      properties:
        systemId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ComponentType'
        name:
          type: string
          example: PaymentService
        description:
          type: string
          example: Обработка транзакций пользователей

    UpdateComponentDto:
      type: object
      required: [type, name, description]
      properties:
        type:
          $ref: '#/components/schemas/ComponentType'
        name:
          type: string
          example: PaymentGateway
        description:
          type: string
          example: Обновленное описание сервиса

    PatchComponentDto:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ComponentType'
        name:
          type: string
          example: NewPaymentService
        description:
          type: string
          example: Только новое описание

    ComponentDto:
      type: object
      required: [id, systemId, type, name, description]
      properties:
        id:
          type: string
          format: uuid
          example: 9a37e1b5-310e-43f1-bfa6-a36c1e55ecbf
        systemId:
          type: string
          format: uuid
          example: b5952d76-e179-4d6d-88b9-e137452d1134
        type:
          $ref: '#/components/schemas/ComponentType'
        name:
          type: string
          example: PaymentService
        description:
          type: string
          example: Обработка транзакций

    # --- Systems ---
    CreateITSystemDto:
      type: object
      required: [name, teamId]
      properties:
        name:
          type: string
          example: Billing Infrastructure
        description:
          type: string
          example: Платежный контур
        teamId:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6

    UpdateITSystemDto:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          example: New Billing Infrastructure
        description:
          type: string
          example: Обновленный контур

    PatchITSystemDto:
      type: object
      properties:
        name:
          type: string
          example: Renamed Billing
        description:
          type: string

    ITSystemDto:
      type: object
      required: [id, name, description, createdAt, updatedAt, teamId, componentsCount]
      properties:
        id:
          type: string
          format: uuid
          example: b5952d76-e179-4d6d-88b9-e137452d1134
        name:
          type: string
          example: Billing System
        description:
          type: string
          example: Основная процессинговая система
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        teamId:
          type: string
          format: uuid
        componentsCount:
          type: integer
          example: 8

    # --- Links ---
    LinkSeverity:
      type: string
      enum: [Low, Mid, High, Unknown]
      example: High

    ProtocolType:
      type: string
      enum: [REST, gRPC, SOAP, AMQP, TCP, Unknown]
      example: gRPC

    CreateLinkDto:
      type: object
      required: [sourceId, targetId, severity, protocol]
      properties:
        sourceId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        severity:
          $ref: '#/components/schemas/LinkSeverity'
        protocol:
          $ref: '#/components/schemas/ProtocolType'

    LinkDto:
      type: object
      required: [id, sourceId, targetId, severity, protocol]
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
        severity:
          $ref: '#/components/schemas/LinkSeverity'
        protocol:
          $ref: '#/components/schemas/ProtocolType'

    # --- Analysis ---
    CycleAnalysisResultDto:
      type: object
      required: [hasCycles, cycles]
      properties:
        hasCycles:
          type: boolean
          example: true
        cycles:
          type: array
          items:
            type: array
            items:
              type: string
              format: uuid

    SpofAnalysisResultDto:
      type: object
      required: [hasSpof, criticalNodes]
      properties:
        hasSpof:
          type: boolean
          example: true
        criticalNodes:
          type: object
          additionalProperties:
            type: integer
          example:
            "9a37e1b5-310e-43f1-bfa6-a36c1e55ecbf": 5

    # --- Auth & Errors ---
    RegisterDto:
      type: object
      required: [username, email, password, inviteCode]
      properties:
        username:
          type: string
          example: john_doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          minLength: 8
          example: SecurePass123!
        inviteCode:
          type: string
          example: 4F5A6B...

    LoginDto:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: john_doe
        password:
          type: string
          example: SecurePass123!

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          example: https://tools.ietf.org/html/rfc7807
        title:
          type: string
          example: Ошибка валидации данных
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Имя компонента не может быть пустой строкой
        instance:
          type: string
          example: /api/v1/components
    
    Role:
      type: string
      enum: [Unauthorized, Developer, SRE, Architect, Admin]
      example: Architect

    UserDto:
      type: object
      required: [id, username, email, role, teamId]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: john_doe
        email:
          type: string
          example: john@example.com
        role:
          $ref: '#/components/schemas/Role'
        teamId:
          type: string
          format: uuid
        avatarId:
          type: string
          format: uuid

    UpdateProfileDto:
      type: object
      required: [username, email]
      properties:
        username:
          type: string
          example: new_username
        email:
          type: string
          example: new_email@example.com
        avatarId:
          type: string
          format: uuid

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword:
          type: string
          example: CurrentPass123!
        newPassword:
          type: string
          example: NewSecretPass456!

    TeamDto:
      type: object
      required: [id, name, description, members]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Core Infrastructure
        description:
          type: string
          example: Команда платформенных инженеров
        members:
          type: array
          items:
            type: string
            format: uuid

    CreateTeamDto:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
          example: Core Infrastructure
        description:
          type: string
          example: Платформенная разработка

    InviteDto:
      type: object
      required: [id, role, targetEmail, code, expirationDate, status]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/Role'
        targetEmail:
          type: string
          example: dev@example.com
        code:
          type: string
          example: 8D4F2E...
        expirationDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [Pending, Activated, Revoked, Expired]

    GenerateInviteDto:
      type: object
      required: [email, teamId, validForDays, role]
      properties:
        email:
          type: string
          example: candidate@example.com
        teamId:
          type: string
          format: uuid
        validForDays:
          type: integer
          example: 7
        role:
          $ref: '#/components/schemas/Role'

    AvatarDto:
      type: object
      required: [id, createdAt, contentType, data]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        contentType:
          type: string
          example: image/webp
        data:
          type: string
          format: byte

    DecommissioningResultDto:
      type: object
      required: [isSafeToDecommission, impactedComponentIds, recommendation]
      properties:
        isSafeToDecommission:
          type: boolean
          example: false
        impactedComponentIds:
          type: array
          items:
            type: string
            format: uuid
        recommendation:
          type: string
          example: Отключение приведет к сбою в 3 связанных компонентах.

    DeploymentRiskResultDto:
      type: object
      required: [riskLevel, riskScore, totalAffectedPaths, summary]
      properties:
        riskLevel:
          type: string
          enum: [Low, Medium, High, Critical]
          example: High
        riskScore:
          type: integer
          example: 25
        totalAffectedPaths:
          type: integer
          example: 4
        summary:
          type: string
          example: Высокий риск. Возможно кратковременное снижение производительности.
